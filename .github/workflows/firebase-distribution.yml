name: Flutter Firebase Distribution

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------- FLUTTER SETUP ----------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'  # ✅ إصدار صحيح
          channel: stable
          cache: true

      - name: Install Dependencies
        run: |
          flutter --version
          flutter pub get

      # ---------------- BUILD APK ----------------
      - name: Build Release APK
        run: |
          flutter clean
          flutter build apk --release --flavor production -t lib/main_production.dart

      # تأكد من وجود الملف
      - name: Verify APK
        run: |
          echo "Checking APK files:"
          ls -la build/app/outputs/flutter-apk/
          
      # ---------------- FIREBASE CLI ----------------
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # ---------------- DISTRIBUTE ----------------
      - name: Upload to Firebase App Distribution
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-production-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --groups "testers" \
            --release-notes "Automated build from GitHub Actions - ${{ github.sha }}" \
            --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}