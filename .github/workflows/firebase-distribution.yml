name: Flutter Firebase Distribution

on:
  push:
    branches:
      - master   # يتنفذ عند الدفع على master
  workflow_dispatch: # تشغيل يدوي

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------- FLUTTER SETUP ----------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"   # حدد نسختك
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # ---------------- BUILD APK ----------------
      - name: Build Release APK
        run: flutter build apk --flavor production -t lib/main_production.dart

      # ---------------- FIREBASE CLI ----------------
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # ---------------- DISTRIBUTE ----------------
      - name: Upload to Firebase App Distribution
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-production-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --testers "test.test20122000@gmail.com" \
            --release-notes "Automated build from GitHub Actions" \
            --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
